name: ProjectA - Deploy

on:
  push:
    branches:
      - 'release/**'

  workflow_dispatch:
    inputs:
      artifact-version:
        description: Select artifact version
        required: true
        type: choice
        options:
          - v1.0.0
          - v1.0.1
        default: v2.0.0


jobs:

  prepare-artifact:
    name: Prepare Artifact
    runs-on: ubuntu-latest

    steps:

      - name: Set Environment Variables
        run: |
          echo "Set Environment Variables"


      # New release path
      - name: Build Artifact
        if: github.event_name == 'push'
        run: |
          echo "Build Artifact"


      - name: Publish Artifact
        if: github.event_name == 'push'
        run: |
          echo "Publish Artifact"


      # Rollback / redeployment path
      - name: Download Artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Download Existing Artifact"
          echo "Artifact Version: ${{ inputs.artifact-version }}"


  deploy-dev:
    name: Deploy to Dev
    needs: prepare-artifact
    runs-on: ubuntu-latest

    steps:

      - name: Deploy Dev
        run: |
          echo "Deploy Artifact to Dev"

  health-check:
    name: Health check
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:

      - name: health check
        run: |
          echo "health check complete"


  deploy-stag:
    name: Deploy staging
    needs: health-check
    runs-on: ubuntu-latest

    steps:

      - name: Deploy staging
        run: |
          echo "Deploy to staging is complete"
