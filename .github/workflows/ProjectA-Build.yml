name: ProjectA - Deploy

on:
  push:
    branches:
      - 'release/**'

  workflow_dispatch:
    inputs:
      artifact-version:
        description: "Select artifact version"
        required: true
        type: choice
        options:
          - v1.0.0
          - v1.0.1
          - v1.0.2
          - v2.0.0
        default: v2.0.0

jobs:

  build-artifact:
    name: Build Artifact
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Build Artifact
        run: |
          echo "=================================="
          echo "Release branch detected"
          echo "Building new artifact..."
          echo "=================================="

  download-artifact:
    name: Download Existing Artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        run: |
          echo "=================================="
          echo "Manual deployment detected"
          echo "Downloading artifact: ${{ inputs.artifact-version }}"
          echo "=================================="

  deploy:
    name: Deploy
    needs:
      - build-artifact
      - download-artifact
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "=================================="
          echo "Deploying package..."
          echo "=================================="
